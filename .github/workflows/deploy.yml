name: Deploy MERN App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Login to DockerHub
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Extract Git Commit SHA for tagging
    - name: Set Image Tag
      id: vars
      run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    # 4. Build Backend Image
    - name: Build Backend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-app:$TAG ./backend

    # 5. Build Frontend Image
    - name: Build Frontend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-app:$TAG ./frontend

    # 6. Push Backend Image
    - name: Push Backend Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/backend-app:$TAG

    # 7. Push Frontend Image
    - name: Push Frontend Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend-app:$TAG

    # 8. Also tag as latest (optional but recommended)
    - name: Tag and Push Latest
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/backend-app:$TAG ${{ secrets.DOCKER_USERNAME }}/backend-app:latest
        docker tag ${{ secrets.DOCKER_USERNAME }}/frontend-app:$TAG ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest
        
        docker push ${{ secrets.DOCKER_USERNAME }}/backend-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest
